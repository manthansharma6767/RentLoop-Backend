$kind: http-request
name: Get My Listings
method: GET
url: '{{baseUrl}}/api/listings/my-listings'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{ownerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
