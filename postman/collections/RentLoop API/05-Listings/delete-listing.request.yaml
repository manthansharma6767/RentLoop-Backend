$kind: http-request
name: Delete Listing
method: DELETE
url: '{{baseUrl}}/api/listings/{{listingId}}'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{ownerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204", function () {
        pm.response.to.have.status(204);
      });
