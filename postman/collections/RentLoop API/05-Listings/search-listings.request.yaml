$kind: http-request
name: Search Listings
method: GET
url: '{{baseUrl}}/api/listings/search'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{renterToken}}'
queryParams:
  - key: categoryId
    value: '{{categoryId}}'
    disabled: true
  - key: minPrice
    value: '100'
    disabled: true
  - key: maxPrice
    value: '1000'
    disabled: true
  - key: startDate
    value: '2025-08-01'
    disabled: true
  - key: endDate
    value: '2025-08-05'
    disabled: true
  - key: page
    value: '0'
  - key: size
    value: '10'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
