$kind: http-request
name: Create Item
method: POST
url: '{{baseUrl}}/api/items'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{ownerToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "categoryId": {{categoryId}},
      "name": "Canon DSLR Camera",
      "description": "Canon EOS 1500D with 18-55mm lens",
      "condition": "LIKE_NEW",
      "attributes": [
        { "key": "brand", "value": "Canon" },
        { "key": "model", "value": "EOS 1500D" }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", function () {
        pm.response.to.have.status(201);
      });
      var json = pm.response.json();
      if (json.id) {
        pm.environment.set("itemId", json.id);
      }
