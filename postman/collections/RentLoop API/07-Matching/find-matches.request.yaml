$kind: http-request
name: Find Matches for Rental Request
method: GET
url: '{{baseUrl}}/api/rental-requests/{{requestId}}/matches'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{renterToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      var json = pm.response.json();
      if (Array.isArray(json) && json.length > 0) {
        pm.environment.set("listingId", json[0].id);
      }
