$kind: http-request
name: Register Renter
method: POST
url: '{{baseUrl}}/api/auth/register'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Test Renter",
      "email": "{{renterEmail}}",
      "password": "{{renterPassword}}",
      "phone": "9876543211"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      var json = pm.response.json();
      if (json.token) {
        pm.environment.set("renterToken", json.token);
      }
