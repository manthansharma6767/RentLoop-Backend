$kind: http-request
name: Login Renter
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{renterEmail}}",
      "password": "{{renterPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      var json = pm.response.json();
      if (json.token) {
        pm.environment.set("renterToken", json.token);
      }
