$kind: http-request
name: Update My Profile
method: PUT
url: '{{baseUrl}}/api/users/me'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{ownerToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Test Owner Updated",
      "phone": "9999999999"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
