$kind: http-request
name: Cancel Rental Request
method: PATCH
url: '{{baseUrl}}/api/rental-requests/{{requestId}}/cancel'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{renterToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204", function () {
        pm.response.to.have.status(204);
      });
