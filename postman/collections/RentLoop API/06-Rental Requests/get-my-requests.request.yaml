$kind: http-request
name: Get My Rental Requests
method: GET
url: '{{baseUrl}}/api/rental-requests/my-requests'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{renterToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
