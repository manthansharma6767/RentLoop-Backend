# Test Configuration - H2 In-Memory Database Profile
# This profile is activated during Maven test phase and overrides environment variables
spring.application.name=rentloop-test

# In-memory H2 database for unit/integration testing
spring.datasource.url=jdbc:h2:mem:rentloop_testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

